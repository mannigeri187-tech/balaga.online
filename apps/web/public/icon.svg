<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081026" />
      <stop offset="100%" stop-color="#0B1B3B" />
    </linearGradient>

    <!-- Amber Orange Gradient (Chill Realm) -->
    <linearGradient id="amberChill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" />
      <stop offset="50%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#E06A00" />
    </linearGradient>

    <!-- Cobalt Blue Gradient (Build Realm) -->
    <linearGradient id="cobaltBuild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D82FF" />
      <stop offset="50%" stop-color="#2D6BFF" />
      <stop offset="100%" stop-color="#144EDB" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF8C00" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#2D6BFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Signature Hexagonal Mark (Group with Filter) -->
  <g filter="url(#markGlow)">
    <!-- Top Half: Amber Orange (Chill / Arch of C) -->
    <path
      d="M 256 86 
         L 396 168 
         L 396 230 
         L 342 198 
         L 256 148 
         L 168 198 
         L 168 256 
         L 114 256 
         L 114 168 
         Z"
      fill="url(#amberChill)"
    />

    <!-- Bottom Half: Cobalt Blue (Build / Base of C) -->
    <path
      d="M 114 256 
         L 168 256 
         L 168 314 
         L 256 364 
         L 342 314 
         L 396 346 
         L 256 426 
         L 114 344 
         Z"
      fill="url(#cobaltBuild)"
    />

    <!-- Right Flange / Forward Connector (Cobalt Blue facet) -->
    <path
      d="M 396 230 
         L 396 346 
         L 342 314 
         L 342 262 
         Z"
      fill="#1E54E6"
    />

    <!-- Center Forward Play / Build Arrow (Negative Space Motif) -->
    <polygon
      points="224,204 316,256 224,308"
      fill="#F8FAFC"
      opacity="0.95"
    />
  </g>
</svg>
